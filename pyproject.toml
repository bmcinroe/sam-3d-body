[project]
name = "sam-3d-body"
version = "0.1.0"
requires-python = ">=3.11"

dependencies = [
    "torch", "torchvision", "numpy", "opencv-python", "pillow",
    "pytorch-lightning", "omegaconf", "yacs", "timm", "einops", "roma",
    "braceexpand", "huggingface-hub",
]

[project.optional-dependencies]

vis = ["pyrender", "trimesh", "matplotlib"]

vitdet = [
    "detectron2 @ git+https://github.com/facebookresearch/detectron2@a1ce2f956a1d2212ad672e3c47d53405c2fe4312",
    "fvcore", "iopath", "pycocotools", "cloudpickle",
    "hydra-core", "tabulate", "termcolor", "matplotlib",
    "setuptools<81",  # detectron2 imports pkg_resources
]

sam3 = [
    "sam3 @ git+https://github.com/facebookresearch/sam3@2345a4ad109ac29c569da749c91d84f10dc08c40",
    "psutil", "pycocotools",  
    "setuptools<81",  
]

moge = [
    "moge @ git+https://github.com/microsoft/MoGe@07444410f1e33f402353b99d6ccd26bd31e469e8",
]
all = ["sam-3d-body[vis,vitdet,sam3,moge]"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["sam_3d_body"]

[tool.hatch.build.targets.wheel.force-include]
"tools" = "sam_3d_body_tools"